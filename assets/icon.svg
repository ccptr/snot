<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132018"/>
      <stop offset="1" stop-color="#0A0F0C"/>
    </linearGradient>
    <linearGradient id="page" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FDFDF7"/>
      <stop offset="1" stop-color="#E7EAE0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8BE24A"/>
      <stop offset="1" stop-color="#2FBF71"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="222" fill="none"
        stroke="#8BE24A" stroke-opacity="0.16" stroke-width="8"/>

  <!-- the page, with a folded top-right corner -->
  <g filter="url(#lift)" transform="rotate(-5 512 512)">
    <path d="M262 214 h384 l124 124 v472 a44 44 0 0 1 -44 44 H262 a44 44 0 0 1 -44 -44 V258 a44 44 0 0 1 44 -44 z"
          fill="url(#page)"/>
    <path d="M646 214 l124 124 h-96 a28 28 0 0 1 -28 -28 z" fill="#C3C9BA"/>
  </g>

  <!-- a single pen stroke: this is a notes app you write in -->
  <g transform="rotate(-5 512 512)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 452 H612" stroke="#B9C0B0" stroke-width="34"/>
    <path d="M300 556 H520" stroke="#B9C0B0" stroke-width="34"/>
    <path d="M296 690 c74 -96 138 -96 186 -20 c46 74 118 74 200 -46"
          stroke="url(#ink)" stroke-width="52"/>
  </g>
</svg>
