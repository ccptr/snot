[workspace]
resolver = "3"
members = ["crates/snot-core", "crates/snot-ffi", "crates/snot-desktop", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
snot-core = { path = "crates/snot-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# GPUI is built against these forks inside the Zed workspace; a git
# dependency on it does not inherit Zed's patches, so they are repeated here.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }
