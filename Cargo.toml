[workspace]
resolver = "3"
members = ["crates/snot-core", "crates/snot-ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
snot-core = { path = "crates/snot-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
