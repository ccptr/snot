name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Only the newest commit on a branch or PR is worth checking; a push that
# supersedes a running check cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # snot-core carries the logic and no system dependencies, so it is
      # worth checking on all three desktop hosts on every push.
      - run: cargo fmt --package snot-core --check
      - run: cargo clippy --package snot-core --all-targets -- -D warnings
      - run: cargo test --package snot-core

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo check --package snot-app

  android:
    name: android
    runs-on: ubuntu-latest
    # On main, release.yml already builds Android, and builds it properly:
    # release profile, all four ABIs, minification on. This debug aarch64 build
    # catches strictly less, so it only earns its ten minutes on pull requests,
    # where release.yml does not run at all.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # Gradle does not support the newest JDKs; 21 is the safe ceiling.
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: cargo install tauri-cli --version "^2" --locked
      # gen/ is gitignored, so the Android project does not exist in a fresh
      # checkout and the build has nothing to assemble.
      - name: Generate the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo tauri android init --ci
      # Regenerating it also brings back the stock manifest, which declares no
      # microphone permission — Android then auto-denies the recorder's runtime
      # request, so the declaration is patched back in on every build.
      - name: Declare the microphone permissions
        run: tools/patch-permissions.sh

      - name: Build the Android app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo tauri android build --debug --apk --target aarch64
