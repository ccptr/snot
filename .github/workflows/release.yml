name: Release

# Builds the Linux desktop app and the signed Android APK for a release and
# attaches them to it. To rebuild an existing release, run it by hand on the
# release's tag: `gh workflow run release.yml --ref v1.2.3`. The signing key is
# in the `release` environment, which only deploys from v* tags.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  desktop:
    name: Linux desktop (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p snot-desktop
      - name: Package
        run: |
          name="snot-${TAG#v}-linux-x86_64"
          mkdir -p "dist/$name"
          # The release profile keeps symbols for UniFFI; the app needs none.
          strip -o "dist/$name/snot" target/release/snot
          cp README.md crates/snot-desktop/assets/fonts/*-OFL.txt "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        run: |
          version="${TAG#v}"
          if [[ ! $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # Ordered like the versions themselves, so every release upgrades the last.
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no ANDROID_KEYSTORE_BASE64 secret, so the APK cannot be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SNOT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - name: Build
        working-directory: android
        env:
          SNOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SNOT_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION"
      - name: Check the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/snot-$VERSION.apk"
          "$apksigner" verify --print-certs "dist/snot-$VERSION.apk"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
