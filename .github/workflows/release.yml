name: Release

# Builds the desktop app and the signed Android APK for a release and attaches
# them to it. To rebuild an existing release, run it by hand on the
# release's tag: `gh workflow run release.yml --ref v1.2.3`. The signing key is
# in the `release` environment, which only deploys from v* tags.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches Cargo.toml
        id: check
        run: |
          version="${TAG#v}"
          cargo=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$version" != "$cargo" ]; then
            echo "::error::Tag '$TAG' does not match version '$cargo' in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One job per desktop platform, all in parallel: each compiles everything
  # for its own target on a native runner, so they have nothing to share. To
  # support another, add an entry; a non-Linux one also needs a Package step.
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: GPUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # A cache saved under one tag is invisible to the next, so only restore;
      # CI's cache on main brings the crate sources, including GPUI's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo build --release --locked -p snot-desktop --target ${{ matrix.target }}
      - name: Package
        if: runner.os == 'Linux'
        run: |
          name="snot-$VERSION-${{ matrix.name }}"
          mkdir -p "dist/$name"
          # The release profile keeps symbols for UniFFI; the app needs none.
          strip -o "dist/$name/snot" "target/${{ matrix.target }}/release/snot"
          cp README.md crates/snot-desktop/assets/fonts/*-OFL.txt "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/snot-* --clobber --repo "$GITHUB_REPOSITORY"

  # Every ABI in one job, as they share the JDK, NDK, Gradle, the Kotlin and
  # resource builds and Rust's host tools; each still gets its own APK. The
  # ABIs are rustAbis in android/app/build.gradle.kts.
  android:
    name: Android APKs
    needs: version
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no ANDROID_KEYSTORE_BASE64 secret, so the APK cannot be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SNOT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - name: Build
        working-directory: android
        env:
          SNOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SNOT_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Check the signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          mkdir dist
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk)
            abi=${abi#app-}
            cp "$apk" "dist/snot-$VERSION-android-$abi.apk"
            "$apksigner" verify --print-certs "dist/snot-$VERSION-android-$abi.apk"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
