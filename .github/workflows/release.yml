# Builds and signs Snot's Android variants, then hands the signed APK to the
# F-Droid repository as a GitHub Release asset.
#
#   a tag v*        -> the release variant, gated on the `release` environment
#   a push to main  -> the nightly variant, published without review
#
# This workflow does not touch the F-Droid repository itself. That repo hosts
# several apps, so its index key, its config and every app's metadata live in
# ccptr/fdroid, which collects the release assets published here. Keeping the
# index key out of each app repo means a compromise of one app cannot forge
# the index for the others, and one workflow owning the deploy means two apps
# publishing at once cannot race each other's index.
#
# The handover format is the contract: a signed APK named
# <applicationId>_<versionCode>.apk on a GitHub Release. Any app, in any
# language, can satisfy it.

name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Which variant to build and sign
        type: choice
        options: [nightly, release]
        default: nightly

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  variant:
    name: pick variant
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then v="$REQUESTED"
          elif [ "${REF#refs/tags/}" != "$REF" ]; then v=release
          else v=nightly
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "variant: $v" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ needs.variant.outputs.name }}
    needs: variant
    runs-on: ubuntu-latest
    # No secrets are referenced anywhere in this job. Adding one here would
    # hand it to every build.rs and npm lifecycle script in the tree.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The nightly versionCode is the commit count, which is 1 in a
          # shallow clone. This must stay 0.
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          # Gradle does not support the newest JDKs; 21 is the safe ceiling.
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install the NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm --prefix ui ci
      - run: cargo install tauri-cli --version "^2" --locked

      - name: Build the unsigned APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          VARIANT: ${{ needs.variant.outputs.name }}
        run: tools/release-android.sh --variant "$VARIANT" --build-only

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snot-${{ needs.variant.outputs.name }}-unsigned
          path: crates/snot-app/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  sign:
    name: sign ${{ needs.variant.outputs.name }}
    needs: [variant, build]
    runs-on: ubuntu-latest
    # `release` should carry required reviewers and be restricted to tag refs;
    # `nightly` deliberately carries neither. Both hold APK_KEYSTORE_B64 and
    # APK_KEYSTORE_PASS under those names, with different values.
    environment: ${{ needs.variant.outputs.name }}
    permissions:
      contents: write   # to attach the APK to a Release
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snot-${{ needs.variant.outputs.name }}-unsigned
          path: ${{ runner.temp }}/incoming

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install apksigner and zipalign
        run: sdkmanager --install "build-tools;36.0.0"

      - name: Unpack the signing key
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/apk.p12"

      - name: Sign
        env:
          VARIANT: ${{ needs.variant.outputs.name }}
          SNOT_DIST_DIR: ${{ runner.temp }}/dist
          # The script reads the pair matching the variant; the environment
          # decides which key the names actually resolve to.
          SNOT_KEYSTORE: ${{ runner.temp }}/apk.p12
          SNOT_NIGHTLY_KEYSTORE: ${{ runner.temp }}/apk.p12
          SNOT_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          SNOT_NIGHTLY_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          SNOT_KEY_ALIAS: ${{ vars.APK_KEY_ALIAS }}
          SNOT_NIGHTLY_KEY_ALIAS: ${{ vars.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          tools/release-android.sh --variant "$VARIANT" --no-publish \
            --apk "$RUNNER_TEMP/incoming/app-universal-release-unsigned.apk"

      - name: Destroy the key
        if: always()
        run: shred -u "$RUNNER_TEMP/apk.p12" 2>/dev/null || true

      # The release variant attaches to the tag that triggered it. The nightly
      # is a single rolling prerelease, replaced each time, so the F-Droid repo
      # always has one obvious place to look.
      - name: Attach the APK to a Release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ needs.variant.outputs.name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=$(ls "$RUNNER_TEMP"/dist/*.apk)
          echo "attaching $(basename "$apk")" >> "$GITHUB_STEP_SUMMARY"
          if [ "$VARIANT" = release ]; then
            gh release view "$TAG" >/dev/null 2>&1 \
              || gh release create "$TAG" --title "$TAG" --generate-notes
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly --prerelease --target "$GITHUB_SHA" \
              --title "Nightly" \
              --notes "Automatic build of ${GITHUB_SHA:0:7}. Installs alongside the release build." \
              "$apk"
          fi

      # Optional: nudge the F-Droid repo to pick this up immediately. Without
      # the token the scheduled run in that repo collects it later instead.
      - name: Ask the F-Droid repo to publish
        env:
          DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
          FDROID_REPO: ${{ vars.FDROID_REPO_SLUG }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ] || [ -z "${FDROID_REPO:-}" ]; then
            echo "no dispatch token; the scheduled run will collect this build"
            exit 0
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST \
            "repos/$FDROID_REPO/dispatches" -f event_type=publish
