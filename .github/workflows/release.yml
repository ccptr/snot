name: Release

# Builds the desktop app for Linux and Windows and the signed Android APKs for
# a release and attaches them to it. To rebuild an existing release, run it by hand on the
# release's tag: `gh workflow run release.yml --ref v1.2.3`. The signing key is
# in the `release` environment, which only deploys from v* tags.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches Cargo.toml
        id: check
        run: |
          version="${TAG#v}"
          cargo=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$version" != "$cargo" ]; then
            echo "::error::Tag '$TAG' does not match version '$cargo' in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One job per desktop platform, all in parallel: each compiles everything
  # for its own target on a native runner, so they have nothing to share. To
  # support another, add an entry; a new OS also needs a Package case.
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # GPUI compiles its shaders with the Windows SDK's fxc.exe, so
          # Windows builds need a Windows runner, and ARM64 a native one.
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    # Git Bash on Windows, so every platform packages with the same script.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: GPUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # A cache saved under one tag is invisible to the next, so only restore;
      # CI's cache on main brings the crate sources, including GPUI's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo build --release --locked -p snot-desktop --target ${{ matrix.target }}
      # Each archive holds one folder of the app, the README and the fonts'
      # licences. The folder is staged outside dist/, which holds only what
      # is uploaded.
      - name: Package
        run: |
          name="snot-$VERSION-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "stage/$name" dist
          cp README.md crates/snot-desktop/assets/fonts/*-OFL.txt "stage/$name/"
          case "$RUNNER_OS" in
            Linux)
              # The release profile keeps symbols for UniFFI; the app needs none.
              strip -o "stage/$name/snot" "$bin/snot"
              tar -C stage -czf "dist/$name.tar.gz" "$name"
              ;;
            Windows)
              # MSVC keeps debug info in a separate .pdb, which is left out.
              cp "$bin/snot.exe" "stage/$name/"
              (cd stage && 7z a -tzip -bso0 "../dist/$name.zip" "$name")
              ;;
            *)
              echo "::error::No packaging for $RUNNER_OS"
              exit 1
              ;;
          esac
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/snot-* --clobber --repo "$GITHUB_REPOSITORY"

  # Every ABI in one job, as they share the JDK, NDK, Gradle, the Kotlin and
  # resource builds and Rust's host tools; each still gets its own APK. The
  # ABIs are rustAbis in android/app/build.gradle.kts.
  android:
    name: Android APKs
    needs: version
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no ANDROID_KEYSTORE_BASE64 secret, so the APK cannot be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SNOT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - name: Build
        working-directory: android
        env:
          SNOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SNOT_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Check the signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          mkdir dist
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk)
            abi=${abi#app-}
            cp "$apk" "dist/snot-$VERSION-android-$abi.apk"
            "$apksigner" verify --print-certs "dist/snot-$VERSION-android-$abi.apk"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"

  # ccptr/fdroid holds the index key and deploys the F-Droid repository; this
  # only asks it to collect the APKs just attached. It takes the latest full
  # release, so a prerelease has nothing to collect and does not ask.
  fdroid:
    name: F-Droid
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Ask ccptr/fdroid to publish
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)" = true ]; then
            echo "$TAG is a prerelease, so F-Droid does not take it"
            exit 0
          fi
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::No FDROID_DISPATCH_TOKEN secret; run publish.yml in ccptr/fdroid by hand"
            exit 1
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh api repos/ccptr/fdroid/dispatches -f event_type=publish
