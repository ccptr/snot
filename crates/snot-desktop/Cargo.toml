[package]
name = "snot-desktop"
description = "Snot for the desktop, drawn with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "snot"
path = "src/main.rs"

[dependencies]
snot-core.workspace = true
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
smallvec = "1"
unicode-segmentation = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8", features = ["wayland", "x11", "font-kit"] }
